# Render Blueprint: https://render.com/docs/blueprint-spec
# One web service on the free plan. Stateless, so one small
# gunicorn worker is plenty for the free plan.
services:
  - type: web
    name: neon-swarm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
